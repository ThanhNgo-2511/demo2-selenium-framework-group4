plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.45.0")
    implementation("org.testng:testng:7.12.0")
    implementation("org.apache.logging.log4j:log4j-core:2.26.1")
    implementation("org.apache.logging.log4j:log4j-api:2.26.1")
    implementation("org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1")
    implementation("com.aventstack:extentreports:5.1.2")

    // REST Assured
    implementation 'io.rest-assured:rest-assured:5.4.0'

    // JSON Path & Hamcrest (thường đi kèm với REST Assured để verify response)
    implementation 'io.rest-assured:json-path:5.4.0'
    implementation 'org.hamcrest:hamcrest:2.2'

    /*Chuyển đổi dữ liệu qua lại giữa Object Java (POJO)
     và định dạng JSON (Serialization/Deserialization)
     để gửi request/verify response API với REST Assured
     , cũng như đọc dữ liệu test từ file .json */
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
}


// Cấu hình chung cho các task TestNG
def configureTestTask = { Test task, List<String> suiteFiles ->

    // Chỉ định thư mục chứa compiled test classes
    task.testClassesDirs = sourceSets.test.output.classesDirs

    // Chỉ định classpath để chạy test
    task.classpath = sourceSets.test.runtimeClasspath

    task.useTestNG {
        useDefaultListeners = true
        suites(*suiteFiles)
    }

    task.outputs.upToDateWhen { false } // Đảm bảo Gradle luôn chạy lại test thay vì lấy cache cũ

    // Nếu TestNG hỗ trợ outputDirectory trực tiếp trong closure useTestNG,
    // hoặc bạn có thể cấu hình report trực tiếp cho task Test:
    task.reports.html.required.set(true)
    task.reports.html.outputLocation.set(file("$projectDir/testoutput/html"))
    task.reports.junitXml.outputLocation.set(file("$projectDir/testoutput/xml"))

    task.testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat = "full"
        showStandardStreams = true
    }
}

// 1. Chạy tất cả test
tasks.named('test', Test) {
    configureTestTask(delegate, [
            'src/test/resources/testng-profile.xml',
            'src/test/resources/testng-course.xml',
            'src/test/resources/testng-authentication.xml'
    ])
}

// 2. Chỉ chạy Profile
tasks.register('testProfile', Test) {
    configureTestTask(delegate, [
            'src/test/resources/testng-profile.xml'
    ])
}

// 3. Chỉ chạy Course
tasks.register('testCourse', Test) {
    configureTestTask(delegate, [
            'src/test/resources/testng-course.xml'
    ])
}

// 4. Chỉ chạy Authentication
tasks.register('testAuthen', Test) {
    configureTestTask(delegate, [
            'src/test/resources/testng-authentication.xml'
    ])
}
